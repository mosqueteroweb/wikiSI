<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" role="img" aria-label="Estados de procesos Linux, señales SIGTERM/SIGKILL y control de servicios systemd frente a Windows SCM">
  <rect x="2" y="2" width="916" height="386" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="460" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700" fill="#0f172a">Ciclo de Vida de Procesos, Señales POSIX y Servicios (systemd vs. Windows SCM)</text>

  <!-- Process States -->
  <rect x="26" y="54" width="868" height="162" rx="10" fill="#f8fafc" stroke="#0891b2" stroke-width="2"/>
  <text x="460" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0e7490">1. Estados del Planificador y Señales de Control (ps aux / top / kill)</text>

  <rect x="48" y="96" width="165" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="130" y="120" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#166534">R · Running</text>
  <text x="130" y="140" text-anchor="middle" font-family="system-ui" font-size="10" fill="#14532d">En CPU o cola listo</text>

  <line x1="213" y1="127" x2="255" y2="127" stroke="#475569" stroke-width="2"/>
  <polygon points="263,127 253,122 253,132" fill="#475569"/>

  <rect x="263" y="96" width="185" height="62" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="355" y="120" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#155e75">S / D · Sleeping</text>
  <text x="355" y="140" text-anchor="middle" font-family="system-ui" font-size="10" fill="#0e7490">Esperando evento o I/O disco</text>

  <line x1="448" y1="127" x2="490" y2="127" stroke="#475569" stroke-width="2"/>
  <polygon points="498,127 488,122 488,132" fill="#475569"/>

  <rect x="498" y="96" width="168" height="62" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="582" y="120" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#9a3412">T · Stopped</text>
  <text x="582" y="140" text-anchor="middle" font-family="system-ui" font-size="10" fill="#7c2d12">Pausado (Ctrl+Z / SIGSTOP)</text>

  <line x1="666" y1="127" x2="708" y2="127" stroke="#dc2626" stroke-width="2"/>
  <polygon points="716,127 706,122 706,132" fill="#dc2626"/>

  <rect x="716" y="96" width="156" height="62" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="794" y="120" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#991b1b">Z · Zombie</text>
  <text x="794" y="140" text-anchor="middle" font-family="system-ui" font-size="10" fill="#7f1d1d">Muerto sin recoger padre</text>

  <rect x="48" y="172" width="824" height="32" rx="5" fill="#e2e8f0"/>
  <text x="460" y="192" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Prioridad nice (-20 máxima a +19 mínima)  |  SIGTERM (-15): cierre limpio ordenado  |  SIGKILL (-9): terminación forzosa inmediata por kernel</text>

  <!-- Services Comparison -->
  <rect x="26" y="232" width="424" height="140" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="238" y="256" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#155e75">systemd (PID 1 en Linux · systemctl)</text>
  <text x="44" y="280" font-family="monospace" font-size="11" fill="#0f172a">systemctl status | start | stop | restart ssh</text>
  <text x="44" y="300" font-family="monospace" font-size="11" fill="#0f172a">systemctl enable | disable ssh  (al arranque)</text>
  <text x="44" y="324" font-family="system-ui" font-size="10.5" fill="#0e7490">Unidades en /etc/systemd/system/*.service y .timer</text>
  <text x="44" y="344" font-family="system-ui" font-size="10.5" fill="#0e7490">reload recarga configuración sin cortar conexiones activas.</text>

  <rect x="470" y="232" width="424" height="140" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="682" y="256" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#312e81">Windows SCM (services.msc / PowerShell)</text>
  <text x="488" y="280" font-family="monospace" font-size="11" fill="#0f172a">Get-Service | Start-Service | Stop-Service</text>
  <text x="488" y="300" font-family="monospace" font-size="11" fill="#0f172a">Set-Service -StartupType Automatic | Disabled</text>
  <text x="488" y="324" font-family="system-ui" font-size="10.5" fill="#3730a3">Procesos CLI: Get-Process / Stop-Process / taskkill</text>
  <text x="488" y="344" font-family="system-ui" font-size="10.5" fill="#3730a3">GUI estándar: services.msc y Administrador de tareas.</text>
</svg>