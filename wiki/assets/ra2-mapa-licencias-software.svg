<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-label="Mapa comparativo de licencias de software libre, permisivo y propietario">
  <rect x="2" y="2" width="916" height="396" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="460" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Mapa de Licencias de Software: Libertades, Copyleft y Modelo Propietario</text>

  <!-- Spectrum Bar -->
  <rect x="44" y="54" width="420" height="28" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="254" y="73" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#166534">SOFTWARE LIBRE Y OPEN SOURCE (Código Fuente Abierto)</text>

  <rect x="476" y="54" width="400" height="28" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="676" y="73" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#991b1b">SOFTWARE NO LIBRE / PROPIETARIO (Código Cerrado)</text>

  <!-- Card 1: Copyleft -->
  <rect x="44" y="98" width="202" height="274" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="145" y="122" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#166534">Copyleft (GPLv3 / LGPL)</text>
  <text x="145" y="142" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#15803d">Linux · GNU · MAX · GIMP</text>
  <line x1="60" y1="154" x2="230" y2="154" stroke="#86efac"/>
  <text x="60" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#14532d">✓ Usar para cualquier fin</text>
  <text x="60" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#14532d">✓ Estudiar y modificar código</text>
  <text x="60" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#14532d">✓ Redistribuir libremente</text>
  <rect x="58" y="242" width="174" height="58" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="145" y="262" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#14532d">Condición clave:</text>
  <text x="145" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#166534">Obras derivadas deben seguir</text>
  <text x="145" y="292" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#166534">siendo GPL (no cerrables)</text>
  <text x="145" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#15803d">LGPL permite enlace dinámico</text>

  <!-- Card 2: Permissive -->
  <rect x="262" y="98" width="202" height="274" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="363" y="122" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#155e75">Permisivas (MIT / BSD / Apache)</text>
  <text x="363" y="142" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#0e7490">FreeBSD · Git · librerías DAM</text>
  <line x1="278" y1="154" x2="448" y2="154" stroke="#a5f3fc"/>
  <text x="278" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#164e63">✓ Usar, modificar, redistribuir</text>
  <text x="278" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#164e63">✓ Integrable en software cerrado</text>
  <text x="278" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#164e63">✓ Uso comercial directo</text>
  <rect x="276" y="242" width="174" height="58" rx="6" fill="#cffafe" stroke="#0891b2"/>
  <text x="363" y="262" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#155e75">Única obligación:</text>
  <text x="363" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#0e7490">Conservar el aviso de</text>
  <text x="363" y="292" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#0e7490">copyright y texto de licencia</text>
  <text x="363" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0e7490">Apache 2.0 añade cláusula patentes</text>

  <!-- Card 3: Freeware / Shareware -->
  <rect x="476" y="98" width="190" height="274" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="571" y="122" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Freeware / Shareware</text>
  <text x="571" y="142" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#b45309">VirtualBox Ext. Pack · WinRAR</text>
  <line x1="492" y1="154" x2="650" y2="154" stroke="#fcd34d"/>
  <text x="492" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#78350f">• Gratis ≠ Software Libre</text>
  <text x="492" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#78350f">✗ Sin acceso a código fuente</text>
  <text x="492" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#78350f">✗ Prohibido modificar</text>
  <rect x="490" y="242" width="162" height="68" rx="6" fill="#fde68a" stroke="#d97706"/>
  <text x="571" y="262" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#78350f">Diferencia:</text>
  <text x="571" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#92400e">Freeware: uso gratuito (PUEL)</text>
  <text x="571" y="294" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#92400e">Shareware: prueba limitada</text>

  <!-- Card 4: Proprietary Commercial -->
  <rect x="682" y="98" width="194" height="274" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="779" y="122" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Comercial (EULA)</text>
  <text x="779" y="142" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#b91c1c">Windows 10 / 11 · Office</text>
  <line x1="698" y1="154" x2="860" y2="154" stroke="#fca5a5"/>
  <text x="698" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7f1d1d">✗ Código cerrado</text>
  <text x="698" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7f1d1d">✗ Licencia por máquina/usuario</text>
  <rect x="696" y="220" width="166" height="132" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="779" y="242" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#991b1b">Modalidades clave:</text>
  <text x="706" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#7f1d1d">• OEM: ligada a la placa</text>
  <text x="706" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#7f1d1d">  base (no transferible)</text>
  <text x="706" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#7f1d1d">• Retail: transferible de PC</text>
  <text x="706" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#7f1d1d">• Volumen (KMS/MAK):</text>
  <text x="706" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#7f1d1d">  empresas e institutos</text>
</svg>
