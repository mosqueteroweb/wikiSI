<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" role="img" aria-label="Comparativa visual de niveles RAID 0, RAID 1, RAID 5 y RAID 10">
  <rect x="2" y="2" width="916" height="386" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="460" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700" fill="#0f172a">Comparativa de Niveles RAID Estándar (Rendimiento vs. Tolerancia a Fallos)</text>

  <!-- RAID 0 -->
  <rect x="24" y="56" width="206" height="256" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="127" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#991b1b">RAID 0 (Striping)</text>
  <text x="127" y="98" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#b91c1c">Mín. 2 discos · 0 tolerancia</text>
  <rect x="44" y="114" width="76" height="110" rx="6" fill="#ffffff" stroke="#ef4444"/>
  <text x="82" y="134" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#1e293b">Disk 0</text>
  <rect x="52" y="144" width="60" height="22" rx="3" fill="#fee2e2"/><text x="82" y="159" text-anchor="middle" font-size="10" font-family="monospace" fill="#7f1d1d">Bloque A1</text>
  <rect x="52" y="172" width="60" height="22" rx="3" fill="#fee2e2"/><text x="82" y="187" text-anchor="middle" font-size="10" font-family="monospace" fill="#7f1d1d">Bloque A3</text>
  <rect x="134" y="114" width="76" height="110" rx="6" fill="#ffffff" stroke="#ef4444"/>
  <text x="172" y="134" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#1e293b">Disk 1</text>
  <rect x="142" y="144" width="60" height="22" rx="3" fill="#fee2e2"/><text x="172" y="159" text-anchor="middle" font-size="10" font-family="monospace" fill="#7f1d1d">Bloque A2</text>
  <rect x="142" y="172" width="60" height="22" rx="3" fill="#fee2e2"/><text x="172" y="187" text-anchor="middle" font-size="10" font-family="monospace" fill="#7f1d1d">Bloque A4</text>
  <text x="127" y="246" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#991b1b">Capacidad: 100% (N x C)</text>
  <text x="127" y="266" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#7f1d1d">Máxima velocidad I/O.</text>
  <text x="127" y="284" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#7f1d1d">Si falla 1 disco, se pierde TODO.</text>

  <!-- RAID 1 -->
  <rect x="246" y="56" width="206" height="256" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="349" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#166534">RAID 1 (Mirroring)</text>
  <text x="349" y="98" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#15803d">Mín. 2 discos · Falla 1 disco</text>
  <rect x="266" y="114" width="76" height="110" rx="6" fill="#ffffff" stroke="#22c55e"/>
  <text x="304" y="134" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#1e293b">Disk 0</text>
  <rect x="274" y="144" width="60" height="22" rx="3" fill="#dcfce7"/><text x="304" y="159" text-anchor="middle" font-size="10" font-family="monospace" fill="#14532d">Bloque A1</text>
  <rect x="274" y="172" width="60" height="22" rx="3" fill="#dcfce7"/><text x="304" y="187" text-anchor="middle" font-size="10" font-family="monospace" fill="#14532d">Bloque A2</text>
  <rect x="356" y="114" width="76" height="110" rx="6" fill="#ffffff" stroke="#22c55e"/>
  <text x="394" y="134" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#1e293b">Disk 1</text>
  <rect x="364" y="144" width="60" height="22" rx="3" fill="#dcfce7"/><text x="394" y="159" text-anchor="middle" font-size="10" font-family="monospace" fill="#14532d">Bloque A1</text>
  <rect x="364" y="172" width="60" height="22" rx="3" fill="#dcfce7"/><text x="394" y="187" text-anchor="middle" font-size="10" font-family="monospace" fill="#14532d">Bloque A2</text>
  <text x="349" y="246" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#166534">Capacidad: 50% (1 x C)</text>
  <text x="349" y="266" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#14532d">Espejo exacto en tiempo real.</text>
  <text x="349" y="284" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#14532d">Ideal para arranque y sistemas SO.</text>

  <!-- RAID 5 -->
  <rect x="468" y="56" width="214" height="256" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="575" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#312e81">RAID 5 (Paridad dist.)</text>
  <text x="575" y="98" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#4338ca">Mín. 3 discos · Falla 1 disco</text>
  <rect x="480" y="114" width="58" height="110" rx="5" fill="#ffffff" stroke="#6366f1"/>
  <text x="509" y="132" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700">D0</text>
  <rect x="486" y="142" width="46" height="20" rx="3" fill="#e0e7ff"/><text x="509" y="156" text-anchor="middle" font-size="9.5" font-family="monospace">A1</text>
  <rect x="486" y="168" width="46" height="20" rx="3" fill="#e0e7ff"/><text x="509" y="182" text-anchor="middle" font-size="9.5" font-family="monospace">B1</text>
  <rect x="486" y="194" width="46" height="20" rx="3" fill="#fde68a"/><text x="509" y="208" text-anchor="middle" font-size="9.5" font-family="monospace" font-weight="700">Pc</text>

  <rect x="546" y="114" width="58" height="110" rx="5" fill="#ffffff" stroke="#6366f1"/>
  <text x="575" y="132" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700">D1</text>
  <rect x="552" y="142" width="46" height="20" rx="3" fill="#e0e7ff"/><text x="575" y="156" text-anchor="middle" font-size="9.5" font-family="monospace">A2</text>
  <rect x="552" y="168" width="46" height="20" rx="3" fill="#fde68a"/><text x="575" y="182" text-anchor="middle" font-size="9.5" font-family="monospace" font-weight="700">Pb</text>
  <rect x="552" y="194" width="46" height="20" rx="3" fill="#e0e7ff"/><text x="575" y="208" text-anchor="middle" font-size="9.5" font-family="monospace">C1</text>

  <rect x="612" y="114" width="58" height="110" rx="5" fill="#ffffff" stroke="#6366f1"/>
  <text x="641" y="132" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700">D2</text>
  <rect x="618" y="142" width="46" height="20" rx="3" fill="#fde68a"/><text x="641" y="156" text-anchor="middle" font-size="9.5" font-family="monospace" font-weight="700">Pa</text>
  <rect x="618" y="168" width="46" height="20" rx="3" fill="#e0e7ff"/><text x="641" y="182" text-anchor="middle" font-size="9.5" font-family="monospace">B2</text>
  <rect x="618" y="194" width="46" height="20" rx="3" fill="#e0e7ff"/><text x="641" y="208" text-anchor="middle" font-size="9.5" font-family="monospace">C2</text>

  <text x="575" y="246" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#312e81">Capacidad: (N - 1) x C</text>
  <text x="575" y="266" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#3730a3">Buen equilibrio coste/espacio.</text>
  <text x="575" y="284" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#3730a3">Reconstrucción lenta en HDD grandes.</text>

  <!-- RAID 10 -->
  <rect x="698" y="56" width="198" height="256" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="797" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#155e75">RAID 10 (1 + 0)</text>
  <text x="797" y="98" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#0e7490">Mín. 4 discos · 1 por espejo</text>

  <rect x="712" y="114" width="80" height="52" rx="5" fill="#ffffff" stroke="#0891b2"/>
  <text x="752" y="135" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#155e75">Mirror 1</text>
  <text x="752" y="153" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#334155">D0(A1) = D1(A1)</text>

  <rect x="802" y="114" width="80" height="52" rx="5" fill="#ffffff" stroke="#0891b2"/>
  <text x="842" y="135" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#155e75">Mirror 2</text>
  <text x="842" y="153" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#334155">D2(A2) = D3(A2)</text>

  <rect x="712" y="178" width="170" height="44" rx="5" fill="#cffafe" stroke="#0891b2"/>
  <text x="797" y="204" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#164e63">Stripe (RAID 0) sobre espejos</text>

  <text x="797" y="246" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#155e75">Capacidad: 50% (N/2 x C)</text>
  <text x="797" y="266" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#0e7490">Sin cálculo de paridad.</text>
  <text x="797" y="284" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#0e7490">Máximo rendimiento en BBDD.</text>

  <!-- Warning Footer -->
  <rect x="24" y="328" width="872" height="46" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="460" y="356" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#9a3412">¡REGLA FUNDAMENTAL! RAID protege frente a fallos físicos de disco (disponibilidad), NUNCA sustituye a una copia de seguridad externa (regla 3-2-1).</text>
</svg>