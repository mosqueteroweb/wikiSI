<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" font-family="system-ui, -apple-system, sans-serif">
  <rect x="2" y="2" width="916" height="426" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="460" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Taxonomía del Software: Licencias, Propósito y Entornos Productivos (RA7.a / RA7.b)</text>
  <text x="460" y="58" text-anchor="middle" font-size="13" fill="#475569">Relación entre modelo legal de licencia, obligaciones para proyectos DAM y criterios de selección empresarial</text>

  <!-- Bloque FOSS -->
  <rect x="35" y="88" width="420" height="258" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="245" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#065f46">Software Libre y Código Abierto (FOSS)</text>
  <text x="245" y="135" text-anchor="middle" font-size="12" fill="#047857">4 Libertades: Usar · Estudiar · Modificar · Redistribuir</text>

  <rect x="52" y="150" width="185" height="178" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="144" y="174" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#065f46">Licencias Copyleft</text>
  <text x="144" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#047857">• GPLv3 / AGPLv3 (Fuerte)</text>
  <text x="144" y="213" text-anchor="middle" font-size="11" fill="#334155">Obra derivada debe mantener</text>
  <text x="144" y="228" text-anchor="middle" font-size="11" fill="#334155">código y misma licencia</text>
  <text x="144" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#047857">• LGPL / MPL-2.0 (Débil)</text>
  <text x="144" y="271" text-anchor="middle" font-size="11" fill="#334155">Permite enlazar librerías en</text>
  <text x="144" y="286" text-anchor="middle" font-size="11" fill="#334155">software propietario</text>
  <text x="144" y="312" text-anchor="middle" font-size="11" font-style="italic" fill="#065f46">Ej.: Kernel Linux, LibreOffice</text>

  <rect x="253" y="150" width="185" height="178" rx="8" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
  <text x="345" y="174" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#065f46">Licencias Permisivas</text>
  <text x="345" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#047857">• MIT / BSD 2-3 Clause</text>
  <text x="345" y="215" text-anchor="middle" font-size="11" fill="#334155">Reutilizable en código</text>
  <text x="345" y="230" text-anchor="middle" font-size="11" fill="#334155">comercial cerrando obra</text>
  <text x="345" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#047857">• Apache License 2.0</text>
  <text x="345" y="273" text-anchor="middle" font-size="11" fill="#334155">Añade concesión expresa</text>
  <text x="345" y="288" text-anchor="middle" font-size="11" fill="#334155">de derechos de patentes</text>
  <text x="345" y="312" text-anchor="middle" font-size="11" font-style="italic" fill="#065f46">Ej.: Nginx, Git, PostgreSQL</text>

  <!-- Bloque Propietario -->
  <rect x="470" y="88" width="415" height="258" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="677" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">Software Propietario y Modelos Comerciales</text>
  <text x="677" y="135" text-anchor="middle" font-size="12" fill="#1d4ed8">Código fuente cerrado · Regido por contrato EULA / CLUF</text>

  <rect x="488" y="150" width="184" height="178" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="580" y="174" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e40af">Pago / Suscripción</text>
  <text x="580" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">• OEM / Retail / Volumen</text>
  <text x="580" y="216" text-anchor="middle" font-size="11" fill="#334155">Por equipo o sede educativa</text>
  <text x="580" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">• SaaS / Suscripción</text>
  <text x="580" y="260" text-anchor="middle" font-size="11" fill="#334155">Pago periódico por usuario</text>
  <text x="580" y="276" text-anchor="middle" font-size="11" fill="#334155">(Microsoft 365, Adobe CC)</text>
  <text x="580" y="310" text-anchor="middle" font-size="11" font-style="italic" fill="#1e40af">Requiere inventario y CALs</text>

  <rect x="684" y="150" width="184" height="178" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="776" y="174" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e40af">Gratuito Cerrado</text>
  <text x="776" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">• Freeware</text>
  <text x="776" y="216" text-anchor="middle" font-size="11" fill="#334155">Coste 0, pero no libre</text>
  <text x="776" y="232" text-anchor="middle" font-size="11" fill="#334155">(prohíbe descompilar/modificar)</text>
  <text x="776" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">• Shareware / Freemium</text>
  <text x="776" y="274" text-anchor="middle" font-size="11" fill="#334155">Prueba limitada o funciones</text>
  <text x="776" y="290" text-anchor="middle" font-size="11" fill="#334155">básicas hasta pagar licencia</text>
  <text x="776" y="310" text-anchor="middle" font-size="11" font-style="italic" fill="#dc2626">¡Ojo uso empresarial!</text>

  <!-- Pie Evaluación Entornos Productivos -->
  <rect x="35" y="362" width="850" height="48" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="460" y="384" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">Criterios de decisión en entorno productivo (RA7.b): TCO total · Formatos abiertos (ODF/PDF-A/JSON sin lock-in)</text>
  <text x="460" y="401" text-anchor="middle" font-size="12" fill="#78350f">Soporte LTS + Cumplimiento RGPD/ENS + Auditoría de dependencias de terceros antes de distribuir software</text>
</svg>
