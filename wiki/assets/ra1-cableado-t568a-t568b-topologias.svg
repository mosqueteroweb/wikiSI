<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-label="Código de colores EIA/TIA-568A y T568B y topología en estrella jerárquica">
  <rect x="2" y="2" width="916" height="426" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="460" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Cableado Estructurado: Estándares RJ-45 (T568A / T568B) y Topología en Estrella</text>

  <!-- Left: T568A vs T568B -->
  <rect x="28" y="54" width="468" height="352" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="262" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155">ORDEN DE PINES EN CONECTOR RJ-45 (8P8C)</text>

  <!-- Column headers -->
  <text x="64" y="106" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#475569">Pin</text>
