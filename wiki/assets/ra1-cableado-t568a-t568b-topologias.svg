  <rect x="104" y="248" width="22" height="22" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="134" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b">Blanco-Azul</text>
  <rect x="290" y="248" width="22" height="22" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="320" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b">Blanco-Azul</text>

  <!-- Pin 6 -->
  <text x="64" y="296" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">6 (RX-)</text>
  <rect x="104" y="280" width="22" height="22" rx="3" fill="#ea580c" stroke="#c2410c" stroke-width="1.5"/>
  <text x="134" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b">Naranja</text>
  <rect x="290" y="280" width="22" height="22" rx="3" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/>
  <text x="320" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b">Verde</text>

  <!-- Pin 7 -->
  <text x="64" y="328" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">7</text>
  <rect x="104" y="312" width="22" height="22" rx="3" fill="#e7e5e4" stroke="#78350f" stroke-width="1.5"/>
  <text x="134" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b">Blanco-Marrón</text>
  <rect x="290" y="312" width="22" height="22" rx="3" fill="#e7e5e4" stroke="#78350f" stroke-width="1.5"/>
  <text x="320" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b">Blanco-Marrón</text>

  <!-- Pin 8 -->
  <text x="64" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">8</text>
  <rect x="104" y="344" width="22" height="22" rx="3" fill="#78350f" stroke="#451a03" stroke-width="1.5"/>
  <text x="134" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b">Marrón</text>
  <rect x="290" y="344" width="22" height="22" rx="3" fill="#78350f" stroke="#451a03" stroke-width="1.5"/>
  <text x="320" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b">Marrón</text>

  <text x="262" y="394" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#475569">Cable directo: T568B–T568B (o T568A–T568A) · Gigabit usa los 8 hilos</text>

  <!-- Right: Structured Cabling Star Topology -->
  <rect x="514" y="54" width="378" height="352" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
