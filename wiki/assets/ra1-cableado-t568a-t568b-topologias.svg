  <!-- Router -->
  <rect x="633" y="96" width="140" height="44" rx="8" fill="#ea580c" stroke="#c2410c" stroke-width="1.5"/>
  <text x="703" y="116" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Router (Capa 3)</text>
  <text x="703" y="131" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ffedd5">Salida WAN / Gateway</text>

  <line x1="703" y1="140" x2="703" y2="168" stroke="#334155" stroke-width="2.5"/>

  <!-- Rack Box -->
  <rect x="546" y="168" width="314" height="106" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" stroke-dasharray="5 3"/>
