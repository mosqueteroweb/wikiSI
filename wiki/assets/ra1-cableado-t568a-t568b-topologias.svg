  <text x="366" y="106" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#c2410c">EIA/TIA-568B (Más común)</text>

  <!-- Pin rows (y starts at 120, step 32) -->
  <!-- Pin 1 -->
  <text x="64" y="136" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">1 (TX+)</text>
  <rect x="104" y="120" width="22" height="22" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="134" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b">Blanco-Verde</text>
  <rect x="290" y="120" width="22" height="22" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
  <text x="320" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b">Blanco-Naranja</text>

  <!-- Pin 2 -->
  <text x="64" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">2 (TX-)</text>
  <rect x="104" y="152" width="22" height="22" rx="3" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/>
  <text x="134" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b">Verde</text>
  <rect x="290" y="152" width="22" height="22" rx="3" fill="#ea580c" stroke="#c2410c" stroke-width="1.5"/>
  <text x="320" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b">Naranja</text>

  <!-- Pin 3 -->
  <text x="64" y="200" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">3 (RX+)</text>
  <rect x="104" y="184" width="22" height="22" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
  <text x="134" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b">Blanco-Naranja</text>
  <rect x="290" y="184" width="22" height="22" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b">Blanco-Verde</text>

  <!-- Pin 4 -->
  <text x="64" y="232" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">4</text>
  <rect x="104" y="216" width="22" height="22" rx="3" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="134" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b">Azul</text>
  <rect x="290" y="216" width="22" height="22" rx="3" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="320" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b">Azul</text>

