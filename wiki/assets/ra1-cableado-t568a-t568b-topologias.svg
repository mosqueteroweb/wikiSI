  <line x1="630" y1="224" x2="630" y2="238" stroke="#6366f1" stroke-width="2"/>
  <line x1="703" y1="224" x2="703" y2="238" stroke="#6366f1" stroke-width="2"/>
  <line x1="776" y1="224" x2="776" y2="238" stroke="#6366f1" stroke-width="2"/>

  <rect x="572" y="238" width="262" height="26" rx="4" fill="#c7d2fe" stroke="#4f46e5"/>
  <text x="703" y="255" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#312e81">Patch Panel (Tomas P01, P02, P03...)</text>

  <!-- Horizontal cabling to workstations -->
  <line x1="610" y1="264" x2="585" y2="322" stroke="#0891b2" stroke-width="2.5"/>
  <line x1="703" y1="264" x2="703" y2="322" stroke="#0891b2" stroke-width="2.5"/>
  <line x1="796" y1="264" x2="821" y2="322" stroke="#0891b2" stroke-width="2.5"/>

  <rect x="530" y="322" width="105" height="64" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="582" y="344" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#155e75">Roseta P01</text>
  <text x="582" y="362" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#0e7490">PC Aula (MAX)</text>
  <text x="582" y="376" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#0891b2">Cat6 ≤ 100 m</text>

  <rect x="650" y="322" width="106" height="64" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="703" y="344" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#155e75">Roseta P02</text>
  <text x="703" y="362" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#0e7490">PC Aula (MAX)</text>
  <text x="703" y="376" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#0891b2">Cat6 ≤ 100 m</text>

  <rect x="771" y="322" width="105" height="64" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="823" y="344" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#92400e">Roseta P03</text>
  <text x="823" y="362" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#b45309">Punto Acceso Wi-Fi</text>
  <text x="823" y="376" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#d97706">PoE / 802.11ax</text>
