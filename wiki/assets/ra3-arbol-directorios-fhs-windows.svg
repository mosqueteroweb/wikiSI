<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-label="Comparativa de jerarquía de directorios FHS Linux frente a unidades de Windows">
  <rect x="2" y="2" width="916" height="416" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="460" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700" fill="#0f172a">Estructura de Directorios: Árbol Único Linux (FHS 3.0) vs. Unidades Windows</text>

  <!-- Linux FHS Left -->
  <rect x="28" y="54" width="465" height="346" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="260" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#155e75">GNU/Linux (MAX / Ubuntu) — Raíz única / (sensible a MAYÚSCULAS)</text>

  <rect x="215" y="92" width="90" height="32" rx="6" fill="#0891b2"/>
  <text x="260" y="113" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#ffffff">/ (root)</text>

  <rect x="44" y="140" width="136" height="54" rx="6" fill="#ffffff" stroke="#06b6d4"/>
  <text x="112" y="159" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#0e7490">/etc</text>
  <text x="112" y="178" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">Configuración global (fstab, netplan)</text>

  <rect x="192" y="140" width="136" height="54" rx="6" fill="#ffffff" stroke="#06b6d4"/>
  <text x="260" y="159" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#0e7490">/home y /root</text>
  <text x="260" y="178" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">Datos personales usuarios y admin</text>

  <rect x="340" y="140" width="136" height="54" rx="6" fill="#ffffff" stroke="#06b6d4"/>
  <text x="408" y="159" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#0e7490">/var y /tmp</text>
  <text x="408" y="178" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">Logs (/var/log), colas y temporales</text>

  <rect x="44" y="208" width="136" height="54" rx="6" fill="#ffffff" stroke="#06b6d4"/>
  <text x="112" y="227" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#0e7490">/bin /sbin /usr</text>
  <text x="112" y="246" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">Comandos, binarios y librerías</text>

  <rect x="192" y="208" width="136" height="54" rx="6" fill="#ffffff" stroke="#06b6d4"/>
  <text x="260" y="227" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#0e7490">/boot y /boot/efi</text>
  <text x="260" y="246" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">Kernel vmlinuz, GRUB y ESP</text>

  <rect x="340" y="208" width="136" height="54" rx="6" fill="#ffffff" stroke="#06b6d4"/>
  <text x="408" y="227" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#0e7490">/dev /proc /sys</text>
  <text x="408" y="246" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">Dispositivos y kernel virtual RAM</text>

  <rect x="44" y="276" width="210" height="52" rx="6" fill="#ffffff" stroke="#06b6d4"/>
  <text x="149" y="295" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#0e7490">/mnt y /media</text>
  <text x="149" y="314" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">Montaje manual (/mnt) o USB automáticos</text>

  <rect x="266" y="276" width="210" height="52" rx="6" fill="#ffffff" stroke="#06b6d4"/>
  <text x="371" y="295" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#0e7490">/opt y /srv</text>
  <text x="371" y="314" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#334155">Apps de terceros y datos de servicios</text>

  <rect x="44" y="340" width="432" height="44" rx="6" fill="#cffafe" stroke="#0891b2"/>
  <text x="260" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#164e63">Todo disco extra se monta dentro de una carpeta del mismo árbol (/mnt/datos)</text>
  <text x="260" y="376" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#155e75">Separador de rutas: barra inclinada /  ·  Archivo = secuencia de bytes (incluidos discos)</text>

  <!-- Windows Right -->
  <rect x="510" y="54" width="382" height="346" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="701" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#312e81">Windows 10 / 11 — Letras de Unidad (\)</text>

  <rect x="530" y="92" width="165" height="34" rx="6" fill="#4f46e5"/>
  <text x="612" y="114" text-anchor="middle" font-family="monospace" font-size="12.5" font-weight="700" fill="#ffffff">C:\ (Sistema)</text>
  <rect x="708" y="92" width="165" height="34" rx="6" fill="#6366f1"/>
  <text x="790" y="114" text-anchor="middle" font-family="monospace" font-size="12.5" font-weight="700" fill="#ffffff">D:\ E:\ (Otros)</text>

  <rect x="530" y="142" width="343" height="50" rx="6" fill="#ffffff" stroke="#6366f1"/>
  <text x="701" y="162" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#312e81">C:\Windows  y  C:\Windows\System32</text>
  <text x="701" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">Núcleo NT, controladores, registro y librerías DLL de 64 bits (SysWOW64 = 32 bits)</text>

  <rect x="530" y="202" width="343" height="50" rx="6" fill="#ffffff" stroke="#6366f1"/>
  <text x="701" y="222" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#312e81">C:\Program Files  y  Program Files (x86)</text>
  <text x="701" y="240" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">Aplicaciones instaladas de 64 bits y 32 bits respectivamente</text>

  <rect x="530" y="262" width="343" height="56" rx="6" fill="#ffffff" stroke="#6366f1"/>
  <text x="701" y="282" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#312e81">C:\Users\&lt;usuario&gt;\  y  C:\ProgramData</text>
  <text x="701" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">Perfiles de usuario, AppData (Local/Roaming) y configuración global oculta</text>

  <rect x="530" y="330" width="343" height="54" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="701" y="352" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#312e81">Cada volumen montado recibe su propia letra (C:, D:, E:)</text>
  <text x="701" y="369" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#3730a3">Separador clásico: barra invertida \  ·  No distingue mayúsculas/minúsculas por defecto</text>
</svg>