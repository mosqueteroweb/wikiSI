<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-label="Ergonomía en puestos con Pantallas de Visualización de Datos y seguridad ESD/Eléctrica">
  <rect x="2" y="2" width="916" height="416" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="460" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Prevención de Riesgos Laborales (PRL): Ergonomía PVD, ESD y Seguridad Eléctrica</text>

  <!-- Left: Ergonomics PVD -->
  <rect x="28" y="54" width="480" height="346" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="268" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155">PUESTO PVD (RD 488/1997)</text>

  <!-- Desk & Monitor -->
  <rect x="190" y="236" width="230" height="12" rx="3" fill="#64748b"/>
  <line x1="395" y1="248" x2="395" y2="352" stroke="#64748b" stroke-width="6"/>
  <!-- Monitor -->
  <rect x="336" y="136" width="16" height="90" rx="2" fill="#1e293b"/>
  <rect x="310" y="226" width="60" height="10" rx="2" fill="#334155"/>
  <!-- Keyboard -->
  <rect x="238" y="228" width="54" height="8" rx="2" fill="#475569"/>

  <!-- Person schematic -->
  <circle cx="152" cy="144" r="20" fill="#fed7aa" stroke="#ea580c" stroke-width="2.5"/>
  <!-- Spine/Torso -->
  <line x1="150" y1="164" x2="146" y2="254" stroke="#ea580c" stroke-width="10" stroke-linecap="round"/>
  <!-- Thigh -->
  <line x1="146" y1="254" x2="226" y2="256" stroke="#c2410c" stroke-width="9" stroke-linecap="round"/>
  <!-- Shin -->
  <line x1="226" y1="256" x2="228" y2="342" stroke="#c2410c" stroke-width="9" stroke-linecap="round"/>
  <!-- Foot -->
  <line x1="228" y1="342" x2="256" y2="346" stroke="#7c2d12" stroke-width="8" stroke-linecap="round"/>
  <!-- Arm (90 deg) -->
  <line x1="150" y1="184" x2="170" y2="224" stroke="#fb923c" stroke-width="7" stroke-linecap="round"/>
  <line x1="170" y1="224" x2="242" y2="224" stroke="#fb923c" stroke-width="7" stroke-linecap="round"/>

  <!-- Chair -->
  <line x1="122" y1="186" x2="122" y2="270" stroke="#4f46e5" stroke-width="5" stroke-linecap="round"/>
  <line x1="122" y1="270" x2="206" y2="270" stroke="#4f46e5" stroke-width="5" stroke-linecap="round"/>
  <line x1="162" y1="270" x2="162" y2="348" stroke="#4f46e5" stroke-width="5"/>
  <line x1="130" y1="348" x2="196" y2="348" stroke="#4f46e5" stroke-width="5" stroke-linecap="round"/>
  <line x1="40" y1="354" x2="494" y2="354" stroke="#94a3b8" stroke-width="2"/>

  <!-- Sight line & Distance annotation -->
  <line x1="172" y1="140" x2="334" y2="140" stroke="#0891b2" stroke-width="2" stroke-dasharray="5 3"/>
  <rect x="200" y="102" width="110" height="28" rx="6" fill="#ecfeff" stroke="#0891b2"/>
  <text x="255" y="120" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#155e75">50 – 70 cm</text>

  <!-- Callouts -->
  <rect x="366" y="122" width="128" height="44" rx="6" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="430" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#3730a3">Borde superior</text>
  <text x="430" y="156" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4338ca">a nivel de los ojos</text>

  <rect x="42" y="198" width="72" height="42" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="78" y="216" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#9a3412">Codos 90°</text>
  <text x="78" y="230" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#c2410c">Apoyo lumbar</text>

  <rect x="250" y="278" width="126" height="42" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="313" y="296" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#9a3412">Rodillas ~90°</text>
  <text x="313" y="311" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#c2410c">Pies firmes en suelo</text>

  <text x="268" y="382" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0e7490">Regla 20-20-20: cada 20 min · mirar a 6 m · 20 seg · Ventanas perpendiculares</text>

  <!-- Right: ESD, Electrical & RAEE -->
  <rect x="526" y="54" width="366" height="346" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="709" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#334155">TALLER, RIESGO ELÉCTRICO Y RAEE</text>

  <rect x="546" y="96" width="326" height="86" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="709" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#92400e">1. Protección Antiestática (ESD)</text>
  <text x="560" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#78350f">• Pulsera ESD (resistencia 1 MΩ) al chasis metálico</text>
  <text x="560" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#78350f">• Sujetar placas/RAM por los bordes (sin tocar pines)</text>
  <text x="560" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#78350f">• Bolsas apantalladas y tapete antiestático</text>

  <rect x="546" y="198" width="326" height="94" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="709" y="220" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#991b1b">2. Seguridad Eléctrica (RD 614/2001)</text>
  <text x="560" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7f1d1d">• Desenchufar AC + pulsar encendido 5 s (descarga)</text>
  <text x="560" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7f1d1d">• Prohibido encadenar regletas o abrir fuentes ATX</text>
  <text x="560" y="276" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7f1d1d">• Toma de tierra, diferencial y SAI/UPS en servidores</text>

  <rect x="546" y="308" width="326" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="709" y="330" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#166534">3. Gestión Ambiental RAEE (RD 110/2015)</text>
  <text x="560" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#14532d">• Punto limpio para hardware, fuentes y placas</text>
  <text x="560" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#14532d">• Contenedor específico: pilas CMOS y baterías SAI</text>
</svg>
