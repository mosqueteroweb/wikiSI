<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" font-family="system-ui, -apple-system, sans-serif">
  <rect x="2" y="2" width="916" height="426" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="460" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Topología LAN Cableada/Wi-Fi, VLAN 802.1Q, Router NAT y Acceso WAN (RA5.c / RA5.d / RA5.e)</text>
  <text x="460" y="58" text-anchor="middle" font-size="13" fill="#475569">Separación de dominios de colisión (Switch L2), dominios de broadcast (VLAN/Router L3) y traducción PAT hacia Internet</text>

  <!-- Clientes LAN -->
  <rect x="40" y="100" width="165" height="88" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="122" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">PCs Aula DAM (Cable)</text>
  <text x="122" y="148" text-anchor="middle" font-size="11.5" fill="#1e3a8a">Ethernet Cat 6 · VLAN 10</text>
  <text x="122" y="166" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#1e3a8a">192.168.10.0/24</text>

  <rect x="40" y="228" width="165" height="96" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="122" y="254" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">Portátiles Wi-Fi</text>
  <text x="122" y="274" text-anchor="middle" font-size="11.5" fill="#b45309">802.11ax · WPA3-SAE</text>
  <text x="122" y="292" text-anchor="middle" font-size="11.5" fill="#b45309">5 GHz / 2,4 GHz (1,6,11)</text>
  <text x="122" y="310" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#92400e">VLAN 20 · 192.168.20.0/24</text>

  <!-- Switch L2 + AP -->
  <rect x="265" y="100" width="170" height="224" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="350" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#5b21b6">Switch Gestionable</text>
  <text x="350" y="152" text-anchor="middle" font-size="12" fill="#4c1d95">Capa 2 · Tabla CAM MAC</text>
  <rect x="280" y="168" width="140" height="44" rx="6" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="350" y="188" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5b21b6">Puertos Access</text>
  <text x="350" y="204" text-anchor="middle" font-size="11" fill="#4c1d95">Sin etiqueta 802.1Q</text>
  <rect x="280" y="222" width="140" height="44" rx="6" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="350" y="242" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5b21b6">Punto de Acceso Wi-Fi</text>
  <text x="350" y="258" text-anchor="middle" font-size="11" fill="#4c1d95">Puente radio ↔ Ethernet</text>
  <rect x="280" y="276" width="140" height="36" rx="6" fill="#ddd6fe"/>
  <text x="350" y="298" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4c1d95">1 dominio colisión / puerto</text>

  <!-- Conexiones izquierda -->
  <line x1="205" y1="144" x2="265" y2="144" stroke="#2563eb" stroke-width="3"/>
  <line x1="205" y1="276" x2="265" y2="244" stroke="#d97706" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- Router / Gateway NAT -->
  <rect x="505" y="122" width="190" height="180" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="600" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">Router L3 + NAT/PAT</text>
  <text x="600" y="172" text-anchor="middle" font-size="12" fill="#047857">Gateway VLAN 10 (.10.1)</text>
  <text x="600" y="190" text-anchor="middle" font-size="12" fill="#047857">Gateway VLAN 20 (.20.1)</text>
  <rect x="520" y="206" width="160" height="78" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="600" y="226" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#065f46">Masquerade / PAT</text>
  <text x="600" y="244" text-anchor="middle" font-size="11" fill="#047857">Traduce IP privada+puerto</text>
  <text x="600" y="260" text-anchor="middle" font-size="11" fill="#047857">a IP pública única WAN</text>
  <text x="600" y="276" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#065f46">ip_forward = 1</text>

  <!-- Enlace Trunk -->
  <line x1="435" y1="212" x2="505" y2="212" stroke="#7c3aed" stroke-width="4"/>
  <text x="470" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">Trunk</text>
  <text x="470" y="228" text-anchor="middle" font-size="10.5" fill="#5b21b6">802.1Q</text>

  <!-- Nube WAN / ISP -->
  <rect x="755" y="146" width="130" height="132" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="820" y="188" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Red WAN</text>
  <text x="820" y="210" text-anchor="middle" font-size="12" fill="#334155">Fibra FTTH / ONT</text>
  <text x="820" y="230" text-anchor="middle" font-size="11.5" fill="#334155">IP Pública ISP</text>
  <text x="820" y="250" text-anchor="middle" font-size="11" font-family="monospace" fill="#475569">0.0.0.0/0</text>

  <line x1="695" y1="212" x2="755" y2="212" stroke="#059669" stroke-width="3.5"/>

  <!-- Pie explicativo -->
  <rect x="40" y="348" width="845" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="372" font-size="12.5" font-weight="bold" fill="#0f172a">Diferencia crítica entre dispositivos:</text>
  <text x="60" y="392" font-size="12" fill="#334155">Switch L2 conmuta por MAC dentro de la misma red/VLAN; el Router conmuta por IP entre subredes distintas y aplica NAT hacia la WAN.</text>
</svg>
