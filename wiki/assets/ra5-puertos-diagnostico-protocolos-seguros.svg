<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" font-family="system-ui, -apple-system, sans-serif">
  <rect x="2" y="2" width="916" height="426" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="460" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Puertos, Diagnóstico Bottom-Up y Protocolos Seguros (RA5.f / RA5.g / RA5.h)</text>
  <text x="460" y="58" text-anchor="middle" font-size="13" fill="#475569">Metodología ordenada de verificación de red y sustitución de servicios en claro por alternativas cifradas</text>

  <!-- Columna Izquierda: Metodología Bottom-Up -->
  <text x="235" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Diagnóstico Ascendente (Bottom-Up)</text>

  <rect x="40" y="108" width="390" height="48" rx="6" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="55" y="128" font-size="12.5" font-weight="bold" fill="#5b21b6">1. Enlace físico / MAC / ARP</text>
  <text x="55" y="146" font-size="11.5" font-family="monospace" fill="#4c1d95">ip link · ip neigh  |  Get-NetAdapter · arp -a</text>

  <rect x="40" y="164" width="390" height="48" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="55" y="184" font-size="12.5" font-weight="bold" fill="#92400e">2. IP local, Gateway y Rutas</text>
  <text x="55" y="202" font-size="11.5" font-family="monospace" fill="#78350f">ip -br a · ip route · ping &lt;GW&gt;  |  Test-NetConnection</text>

  <rect x="40" y="220" width="390" height="48" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="55" y="240" font-size="12.5" font-weight="bold" fill="#065f46">3. Conectividad WAN y Resolución DNS</text>
  <text x="55" y="258" font-size="11.5" font-family="monospace" fill="#047857">ping 1.1.1.1 · mtr · dig dom.es  |  tracert · Resolve-DnsName</text>

  <rect x="40" y="276" width="390" height="48" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="55" y="296" font-size="12.5" font-weight="bold" fill="#1e40af">4. Puertos en escucha y Aplicación</text>
  <text x="55" y="314" font-size="11.5" font-family="monospace" fill="#1e3a8a">ss -tulnp · nc -zv host 443  |  Get-NetTCPConnection -State Listen</text>

  <rect x="40" y="332" width="390" height="48" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="55" y="352" font-size="12.5" font-weight="bold" fill="#0f172a">5. Inspección profunda de paquetes</text>
  <text x="55" y="370" font-size="11.5" font-family="monospace" fill="#334155">tcpdump -i eth0 port 53 -n  |  Wireshark</text>

  <!-- Columna Derecha: Inseguro vs Seguro -->
  <text x="675" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Migración hacia Protocolos Seguros</text>

  <!-- Filas comparativas -->
  <rect x="470" y="108" width="190" height="48" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="565" y="128" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">Telnet (TCP 23)</text>
  <text x="565" y="146" text-anchor="middle" font-size="11" fill="#b91c1c">Texto plano (sin cifrar)</text>
  <text x="675" y="137" text-anchor="middle" font-size="16" font-weight="bold" fill="#059669">→</text>
  <rect x="690" y="108" width="190" height="48" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="785" y="128" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">SSH (TCP 22)</text>
  <text x="785" y="146" text-anchor="middle" font-size="11" fill="#15803d">Cifrado + Claves Ed25519</text>

  <rect x="470" y="168" width="190" height="48" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="565" y="188" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">FTP (TCP 20/21)</text>
  <text x="565" y="206" text-anchor="middle" font-size="11" fill="#b91c1c">Credenciales visibles</text>
  <text x="675" y="197" text-anchor="middle" font-size="16" font-weight="bold" fill="#059669">→</text>
  <rect x="690" y="168" width="190" height="48" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="785" y="188" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">SFTP (22) / FTPS (990)</text>
  <text x="785" y="206" text-anchor="middle" font-size="11" fill="#15803d">Canal cifrado SSH / TLS</text>

  <rect x="470" y="228" width="190" height="48" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="565" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">HTTP (TCP 80)</text>
  <text x="565" y="266" text-anchor="middle" font-size="11" fill="#b91c1c">Sin integridad ni TLS</text>
  <text x="675" y="257" text-anchor="middle" font-size="16" font-weight="bold" fill="#059669">→</text>
  <rect x="690" y="228" width="190" height="48" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="785" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">HTTPS (TCP 443)</text>
  <text x="785" y="266" text-anchor="middle" font-size="11" fill="#15803d">TLS 1.3 + Certificados X.509</text>

  <rect x="470" y="288" width="190" height="48" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="565" y="308" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">DNS clásico (53)</text>
  <text x="565" y="326" text-anchor="middle" font-size="11" fill="#b91c1c">Consultas legibles en ISP</text>
  <text x="675" y="317" text-anchor="middle" font-size="16" font-weight="bold" fill="#059669">→</text>
  <rect x="690" y="288" width="190" height="48" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="785" y="308" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">DoT (853) / DoH (443)</text>
  <text x="785" y="326" text-anchor="middle" font-size="11" fill="#15803d">Resolución privada cifrada</text>

  <rect x="470" y="346" width="410" height="40" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="675" y="370" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">Rangos de Puertos: Bien conocidos (0–1023) · Registrados (1024–49151) · Efímeros (49152–65535)</text>
</svg>
