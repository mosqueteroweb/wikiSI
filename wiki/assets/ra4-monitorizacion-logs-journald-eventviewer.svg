<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" role="img" aria-label="Flujo de monitorización de métricas y registros de eventos en Linux journald y Windows Event Viewer">
  <rect x="2" y="2" width="916" height="376" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="460" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700" fill="#0f172a">Monitorización en Tiempo Real y Auditoría de Registros (journalctl vs. Event Viewer)</text>

  <!-- Métricas tiempo real -->
  <rect x="26" y="54" width="868" height="122" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="460" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">1. Los 4 Cuellos de Botella de Rendimiento del Sistema</text>

  <rect x="44" y="92" width="194" height="68" rx="6" fill="#ecfeff" stroke="#0891b2"/>
  <text x="141" y="112" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="700" fill="#155e75">CPU y Load Average</text>
  <text x="141" y="130" text-anchor="middle" font-family="monospace" font-size="10" fill="#0f172a">htop / uptime / mpstat</text>
  <text x="141" y="147" text-anchor="middle" font-family="monospace" font-size="10" fill="#3730a3">Win: TaskMgr / perfmon</text>

  <rect x="256" y="92" width="194" height="68" rx="6" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="353" y="112" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="700" fill="#312e81">RAM y Paginación</text>
  <text x="353" y="130" text-anchor="middle" font-family="monospace" font-size="10" fill="#0f172a">free -h / vmstat 1</text>
  <text x="353" y="147" text-anchor="middle" font-family="monospace" font-size="10" fill="#3730a3">Win: resmon (Memoria)</text>

  <rect x="468" y="92" width="194" height="68" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="565" y="112" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="700" fill="#9a3412">E/S Disco (IOPS)</text>
  <text x="565" y="130" text-anchor="middle" font-family="monospace" font-size="10" fill="#0f172a">iostat -xz / iotop</text>
  <text x="565" y="147" text-anchor="middle" font-family="monospace" font-size="10" fill="#7c2d12">Win: resmon (Disco %)</text>

  <rect x="680" y="92" width="194" height="68" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="777" y="112" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="700" fill="#166534">Red y Sockets</text>
  <text x="777" y="130" text-anchor="middle" font-family="monospace" font-size="10" fill="#0f172a">ss -tulnp / nload</text>
  <text x="777" y="147" text-anchor="middle" font-family="monospace" font-size="10" fill="#14532d">Win: resmon / Get-NetTCP</text>

  <!-- Logs Linux -->
  <rect x="26" y="192" width="424" height="168" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="238" y="216" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#155e75">Logs en Linux: systemd-journald + /var/log + logrotate</text>
  <text x="42" y="242" font-family="monospace" font-size="10.5" fill="#0f172a">journalctl -u ssh -p err -n 20</text>
  <text x="42" y="262" font-family="monospace" font-size="10.5" fill="#0f172a">journalctl --since "1 hour ago"  |  dmesg -T</text>
  <text x="42" y="286" font-family="system-ui" font-size="10.5" fill="#0e7490">• /var/log/auth.log: inicios de sesión y sudo</text>
  <text x="42" y="306" font-family="system-ui" font-size="10.5" fill="#0e7490">• /var/log/syslog: eventos generales de servicios</text>
  <text x="42" y="326" font-family="system-ui" font-size="10.5" font-weight="700" fill="#155e75">• logrotate comprime y rota logs para no llenar /var</text>

  <!-- Logs Windows -->
  <rect x="470" y="192" width="424" height="168" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="682" y="216" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#312e81">Logs en Windows: Visor de Eventos (eventvwr.msc)</text>
  <text x="486" y="242" font-family="monospace" font-size="10.5" fill="#0f172a">Get-WinEvent -LogName Security -MaxEvents 10</text>
  <text x="486" y="262" font-family="monospace" font-size="10.5" fill="#0f172a">Get-WinEvent -FilterHashtable @{LogName='System';Level=2}</text>
  <text x="486" y="286" font-family="system-ui" font-size="10.5" fill="#3730a3">• Registro Sistema: drivers, energía, discos, servicios</text>
  <text x="486" y="306" font-family="system-ui" font-size="10.5" fill="#3730a3">• Registro Seguridad: auditorías de acceso (EventID 4624/4625)</text>
  <text x="486" y="326" font-family="system-ui" font-size="10.5" fill="#3730a3">• Registro Aplicación: errores de IDEs, BBDD y runtime</text>
</svg>