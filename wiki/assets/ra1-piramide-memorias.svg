<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-label="Pirámide de la jerarquía de memoria">
  <rect x="2" y="2" width="896" height="436" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="450" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Jerarquía de Memoria: Velocidad, Capacidad y Coste por Bit</text>

  <!-- Left Arrow: Speed & Cost -->
  <line x1="66" y1="365" x2="66" y2="90" stroke="#ea580c" stroke-width="4"/>
  <polygon points="66,76 56,96 76,96" fill="#ea580c"/>
  <text x="66" y="388" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#c2410c">+ Velocidad</text>
  <text x="66" y="404" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#c2410c">+ Coste/bit</text>

  <!-- Right Arrow: Capacity -->
  <line x1="834" y1="90" x2="834" y2="365" stroke="#4f46e5" stroke-width="4"/>
  <polygon points="834,378 824,358 844,358" fill="#4f46e5"/>
  <text x="834" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#3730a3">+ Capacidad</text>
  <text x="834" y="396" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#3730a3">- Coste/bit</text>

  <!-- Level 1: Registers -->
  <polygon points="390,66 510,66 550,126 350,126" fill="#ea580c" stroke="#c2410c" stroke-width="1.5"/>
  <text x="450" y="92" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Registros CPU</text>
  <text x="450" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#ffedd5">&lt; 1 ns · Bytes / KiB · Volátil</text>

  <!-- Level 2: SRAM Cache -->
  <polygon points="346,132 554,132 600,192 300,192" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
  <text x="450" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Caché L1 / L2 / L3 (SRAM)</text>
  <text x="450" y="176" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#fff7ed">1–25 ns · KiB a decenas MiB · Volátil</text>

  <!-- Level 3: Main Memory DRAM -->
  <polygon points="296,198 604,198 652,258 248,258" fill="#4f46e5" stroke="#3730a3" stroke-width="1.5"/>
  <text x="450" y="224" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Memoria Principal (RAM DDR4/DDR5)</text>
  <text x="450" y="242" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#e0e7ff">50–80 ns · 16 GB en aula (máx. 10–12 GB VMs) · Volátil</text>

  <!-- Level 4: Secondary Storage -->
  <polygon points="244,264 656,264 706,324 194,324" fill="#0891b2" stroke="#155e75" stroke-width="1.5"/>
  <text x="450" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Almacenamiento Secundario (NVMe · SSD · HDD · Swap)</text>
  <text x="450" y="308" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#cffafe">20 µs – 10 ms · Cientos GB / TB · No volátil</text>

  <!-- Level 5: Tertiary / Backup -->
  <polygon points="190,330 710,330 760,390 140,390" fill="#334155" stroke="#0f172a" stroke-width="1.5"/>
  <text x="450" y="356" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Almacenamiento Terciario y Copias Externas (USB · NAS · Cintas)</text>
  <text x="450" y="374" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#cbd5e1">Milisegundos a segundos · Terabytes · No volátil y extraíble</text>

  <!-- Firmware callout -->
  <rect x="110" y="70" width="180" height="74" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="200" y="92" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Firmware (No volátil)</text>
  <text x="200" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">ROM / EEPROM / NOR Flash</text>
  <text x="200" y="127" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Almacena BIOS / UEFI</text>
</svg>
