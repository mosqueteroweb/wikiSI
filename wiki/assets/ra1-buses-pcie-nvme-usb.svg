<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-label="Buses PCIe directos a CPU y conexiones a través del Chipset PCH">
  <rect x="2" y="2" width="916" height="416" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="460" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Interconexión de Periféricos: Líneas PCIe Directas vs. Chipset (PCH)</text>

  <!-- CPU -->
  <rect x="335" y="58" width="250" height="82" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="460" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#9a3412">CPU (Procesador)</text>
  <text x="460" y="109" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c2410c">Controlador Memoria + 20–28 carriles PCIe directos</text>
  <text x="460" y="126" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ea580c">Baja latencia y máximo ancho de banda</text>

  <!-- Direct CPU Connections -->
  <!-- RAM -->
  <line x1="335" y1="99" x2="238" y2="99" stroke="#4f46e5" stroke-width="4"/>
  <rect x="44" y="64" width="194" height="70" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="141" y="92" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#3730a3">Memoria RAM DDR4/5</text>
  <text x="141" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#4338ca">Dual Channel (128 bits)</text>

  <!-- GPU PCIe x16 -->
  <line x1="585" y1="84" x2="682" y2="84" stroke="#ea580c" stroke-width="4"/>
  <rect x="682" y="52" width="194" height="58" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="779" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#9a3412">Ranura PCIe x16 (GPU)</text>
  <text x="779" y="94" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#c2410c">PCIe 4.0: ~32 GB/s · DisplayPort/HDMI</text>

  <!-- M.2 NVMe PCIe x4 -->
  <line x1="585" y1="124" x2="682" y2="124" stroke="#0891b2" stroke-width="3.5"/>
  <rect x="682" y="120" width="194" height="58" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="779" y="144" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#155e75">SSD M.2 NVMe (PCIe x4)</text>
  <text x="779" y="162" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#0e7490">Protocolo NVMe · 3.500–7.000+ MB/s</text>

  <!-- DMI Link to Chipset -->
  <line x1="460" y1="140" x2="460" y2="210" stroke="#1e293b" stroke-width="5"/>
  <rect x="380" y="158" width="160" height="28" rx="6" fill="#1e293b"/>
  <text x="460" y="176" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#f8fafc">Enlace DMI / PCIe x4–x8</text>

  <!-- Chipset / PCH -->
  <rect x="280" y="210" width="360" height="68" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2.5"/>
  <text x="460" y="238" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Chipset / PCH (Platform Controller Hub)</text>
  <text x="460" y="258" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Distribuye los buses de E/S secundarios y almacenamiento</text>

  <!-- Downstream peripherals -->
  <line x1="340" y1="278" x2="140" y2="316" stroke="#64748b" stroke-width="2.5"/>
  <line x1="415" y1="278" x2="355" y2="316" stroke="#64748b" stroke-width="2.5"/>
  <line x1="505" y1="278" x2="570" y2="316" stroke="#64748b" stroke-width="2.5"/>
  <line x1="580" y1="278" x2="780" y2="316" stroke="#64748b" stroke-width="2.5"/>

  <!-- Box 1: SATA III -->
  <rect x="44" y="316" width="194" height="78" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="141" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e293b">SATA III (AHCI)</text>
  <text x="141" y="358" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">6 Gbps (~600 MB/s reales)</text>
  <text x="141" y="376" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">HDD 3.5&quot; / SSD SATA 2.5&quot;</text>

  <!-- Box 2: USB -->
  <rect x="256" y="316" width="198" height="78" rx="8" fill="#f8fafc" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="355" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#3730a3">Controlador USB (xHCI)</text>
  <text x="355" y="358" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#4338ca">USB 2.0 (480M) · 3.2 (5–20G)</text>
  <text x="355" y="376" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4f46e5">USB4 / USB-C (40 Gbps + PD)</text>

  <!-- Box 3: LAN / Wi-Fi -->
  <rect x="472" y="316" width="198" height="78" rx="8" fill="#f8fafc" stroke="#0891b2" stroke-width="1.8"/>
  <text x="571" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#155e75">Red Ethernet / Wi-Fi</text>
  <text x="571" y="358" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#0e7490">PCIe x1 · 1 / 2.5 Gbps RJ-45</text>
  <text x="571" y="376" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#0891b2">M.2 Key E (Wi-Fi + Bluetooth)</text>

  <!-- Box 4: Audio / SPI -->
  <rect x="688" y="316" width="188" height="78" rx="8" fill="#f8fafc" stroke="#d97706" stroke-width="1.8"/>
  <text x="782" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#92400e">Audio / SPI / TPM</text>
  <text x="782" y="358" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#b45309">Chip BIOS/UEFI · TPM 2.0</text>
  <text x="782" y="376" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#d97706">Códec HD Audio · Super I/O</text>
</svg>
